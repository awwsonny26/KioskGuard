<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660"><rect width="760" height="660" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif" fill="#111"><rect x="10" y="10" width="740" height="144" rx="5" fill="#fff" stroke="#222" stroke-width="2"/><text x="30" y="42" font-size="22" font-weight="bold">main: super loop без RTOS</text><rect x="25" y="58" width="350" height="80" fill="#f4f6f8" stroke="#777"/><text x="39" y="88" font-size="17">TIM3 1 МГц</text><text x="39" y="115" font-size="17">Абсолютні строки, без catch-up</text><rect x="390" y="58" width="350" height="80" fill="#f4f6f8" stroke="#777"/><text x="404" y="88" font-size="17">WFI між викликами</text><text x="404" y="115" font-size="17">SysTick / UART / TIM3 IRQ</text><path d="M380 154v18m-5-5 5 5 5-5" stroke="#222" stroke-width="2" fill="none"/><rect x="10" y="174" width="740" height="144" rx="5" fill="#fff" stroke="#222" stroke-width="2"/><text x="30" y="206" font-size="22" font-weight="bold">Platform: збір та команди</text><rect x="25" y="222" width="350" height="80" fill="#f4f6f8" stroke="#777"/><text x="39" y="252" font-size="17">PIR 20 мс · IMU 20 мс</text><text x="39" y="279" font-size="17">ADC 50 мс · retry 1000 мс</text><rect x="390" y="222" width="350" height="80" fill="#f4f6f8" stroke="#777"/><text x="404" y="252" font-size="17">UART RX: 127 байтів</text><text x="404" y="279" font-size="17">До 32 байтів за 1 мс</text><path d="M380 318v18m-5-5 5 5 5-5" stroke="#222" stroke-width="2" fill="none"/><rect x="10" y="338" width="740" height="144" rx="5" fill="#fff" stroke="#222" stroke-width="2"/><text x="30" y="370" font-size="22" font-weight="bold">App: стан термінала, кожні 5 мс</text><rect x="25" y="386" width="350" height="80" fill="#f4f6f8" stroke="#777"/><text x="39" y="416" font-size="17">USER_NEAR завжди INFO</text><text x="39" y="443" font-size="17">Механіка / світло: CONTROL чи SERVICE</text><rect x="390" y="386" width="350" height="80" fill="#f4f6f8" stroke="#777"/><text x="404" y="416" font-size="17">16 незмінних подій</text><text x="404" y="443" font-size="17">Явний лічильник втрат</text><path d="M380 482v18m-5-5 5 5 5-5" stroke="#222" stroke-width="2" fill="none"/><rect x="10" y="502" width="740" height="144" rx="5" fill="#fff" stroke="#222" stroke-width="2"/><text x="30" y="534" font-size="22" font-weight="bold">Журнал та вивід</text><rect x="25" y="550" width="350" height="80" fill="#f4f6f8" stroke="#777"/><text x="39" y="580" font-size="17">2 × 2048 байтів flash</text><text x="39" y="607" font-size="17">CRC32 + commit, крок 8 байтів</text><rect x="390" y="550" width="350" height="80" fill="#f4f6f8" stroke="#777"/><text x="404" y="580" font-size="17">UART TX через IRQ</text><text x="404" y="607" font-size="17">Експорт / STAT / HIST</text></g></svg>
